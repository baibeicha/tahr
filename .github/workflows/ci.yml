name: CI / Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build CLI
        run: go build -v ./cmd/tahr

      - name: Build & Verify Plugin Packages
        run: go run ./cmd/tahr-pack -dir plugins
