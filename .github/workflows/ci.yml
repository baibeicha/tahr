name: CI / Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Tests & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run Vet / Lint
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binaries (Linux & Windows)
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/tahr-linux-amd64 ./cmd/tahr
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/tahr-windows-amd64.exe ./cmd/tahr

      - name: Build & Package Plugins (.tahr)
        run: |
          go run ./cmd/tahr-pack -dir plugins
          mkdir -p plugin-dist
          cp plugins/*.tahr plugin-dist/
          cd plugin-dist
          zip -9 ../tahr-plugins-all.zip *.tahr
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tahr-dev-build
          path: |
            bin/tahr-linux-amd64
            bin/tahr-windows-amd64.exe
            tahr-plugins-all.zip
            plugins/*.tahr
